<!DOCTYPE html>
<html>
<head>

<title>Mark Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
function getLocationAndMarkAttendance() {

  if (!navigator.geolocation) {
    alert("Geolocation not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition(async function(position) {

    const studentLat = position.coords.latitude;
    const studentLng = position.coords.longitude;

    // Example lecture hall location
    const lectureLat = 8.407564;
    const lectureLng = 4.681535;

    const distance = calculateDistance(
      studentLat,
      studentLng,
      lectureLat,
      lectureLng
    );

    if (distance > 100) {
      alert("You are too far from the lecture hall");
      return;
    }

    // call your existing attendance function
    markAttendance();

  });

}
</script>

<script>
function calculateDistance(lat1, lon1, lat2, lon2) {

  const R = 6371e3;

  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;

  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(Δφ/2) * Math.sin(Δφ/2) +
    Math.cos(φ1) *
    Math.cos(φ2) *
    Math.sin(Δλ/2) *
    Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;

}
</script>

</head>

<body>

<h2>Student Attendance</h2>

<input id="matricNumber" placeholder="Enter Matric Number">

<!-- <button onclick="markAttendance()">Mark Attendance</button> -->
<button onclick="getLocationAndMarkAttendance()">
Submit Attendance
</button>

<p id="message"></p>

<script src="script.js"></script>

</body>
</html>
