<!DOCTYPE html>
<html>

<head>
<title>Lecturer Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<div class="container">

  <h1>AATU Smart Attendance System</h1>

  <!-- CREATE LECTURE -->
  <div class="card">
    <h2>Create Lecture Session</h2>

    <input id="courseCode" placeholder="Course Code">
    <input type="date" id="date">

    <button onclick="createLecture()">Create Session</button>
    <p id="status"></p>
  </div>

  <!-- QR CODE -->
  <div class="card">
    <h2>QR Code</h2>
    <canvas id="qrcode"></canvas>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="actions">
    <button onclick="viewReport()">View Attendance Report</button>
    <button onclick="checkEligibility()">Check Exam Eligibility</button>
  </div>

  <!-- Eligibility-Summary -->
  <div class="eligibility-summary">

    <div class="eligible-box">
        <h3 id="eligibleCount">0</h3>
        <p>Eligible</p>
    </div>

    <div class="not-eligible-box">
        <h3 id="notEligibleCount">0</h3>
        <p>Not Eligible</p>
    </div>

  </div>

  <!-- RESULTS -->
  <div class="card">
    <h2>Results</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Matric Number</th>
          <th>Attendance</th>
          <th>Percentage %</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>

</body>

</html>
