<!DOCTYPE html>
<html>
<head>
<title>Attendance Report</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

<h2>Attendance Report</h2>
<p id="stats"></p>

<!-- STATS -->
<div class="stats">
    <div class="stat-box">
        <h3 id="totalStudents">0</h3>
        <p>Total Students</p>
    </div>

    <div class="stat-box">
        <h3 id="present">0</h3>
        <p>Present</p>
    </div>

    <div class="stat-box">
        <h3 id="absent">0</h3>
        <p>Absent</p>
    </div>

    <div class="stat-box">
        <h3 id="rate">0</h3>
        <p>Attendance Rate</p>
    </div>
</div>

  <!-- Eligibility-Summary -->
  <div class="eligibility-summary">

    <div class="eligible-box">
        <h3 id="eligibleCount">0</h3>
        <p>Eligible</p>
    </div>

    <div class="not-eligible-box">
        <h3 id="notEligibleCount">0</h3>
        <p>Not Eligible</p>
    </div>

  </div>

<table border="1">

<thead>
<tr>
<th>Name</th>
<th>Matric Number</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>
</table>

<script src="script.js"></script>

</body>

</html>
